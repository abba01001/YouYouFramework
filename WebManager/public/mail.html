<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>邮件管理</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f7f9; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
        input, textarea { width: 100%; margin-bottom: 15px; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; color: white; background: #0078d4; font-weight: 500; }
        .btn-back { background: #eee; color: #444; width: auto; margin-bottom: 20px; padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>
<div class="card">
    <button class="btn-back" onclick="window.location.href='index.html'">← 返回主面板</button>
    <h2>📧 邮件发送</h2>
    <input type="text" id="to" placeholder="收件人">
    <input type="text" id="sub" placeholder="主题">
    <textarea id="msg" rows="5" placeholder="正文"></textarea>
    <button class="btn" onclick="send()">发送邮件</button>
    <div id="res" style="margin-top:15px; font-size:13px; color:#555;"></div>
</div>
<script>
    function send() {
        fetch('/api/utils/send-mail', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({to:document.getElementById('to').value, subject:document.getElementById('sub').value, text:document.getElementById('msg').value})
        }).then(res=>res.text()).then(t=>document.getElementById('res').innerText = "> " + t);
    }
</script>
</body>
</html>
